markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/selvaz/LazyBridge
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/lazybridge/
      name: PyPI
    - icon: fontawesome/solid/envelope
      link: mailto:LazyBridgeLabs@gmail.com
      name: Email LazyBridge Labs

