site_name: LazyBridge
site_description: A Python composition runtime for LLM workflows — not an agent framework. Compose functions, agents, plans and humans through one tool interface.
site_url: https://lazybridge.com/
repo_url: https://github.com/selvaz/LazyBridge
repo_name: selvaz/LazyBridge
copyright: Copyright &copy; 2026 LazyBridge — Apache-2.0

docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_url_format: "{slug}"
  # Redirect the old apex doc URLs (lazybridge.com/<path>/) — left over from
  # before the technical docs were re-homed to core.lazybridge.com — to their
  # new locations. GitHub Pages can't do server-side 301s, so this generates a
  # tiny meta-refresh + canonical stub per URL, which both bounces visitors and
  # tells Google to drop the stale apex entry and consolidate onto the target.
  - redirects:
      redirect_maps:
        'beginners/01-what-is-an-llm.md': 'https://core.lazybridge.com/beginners/01-what-is-an-llm/'
        'beginners/02-raw-sdks.md': 'https://core.lazybridge.com/beginners/02-raw-sdks/'
        'beginners/03-first-agent.md': 'https://core.lazybridge.com/beginners/03-first-agent/'
        'beginners/04-tools.md': 'https://core.lazybridge.com/beginners/04-tools/'
        'beginners/05-multi-agent.md': 'https://core.lazybridge.com/beginners/05-multi-agent/'
        'beginners/06-verify.md': 'https://core.lazybridge.com/beginners/06-verify/'
        'beginners/07-chain.md': 'https://core.lazybridge.com/beginners/07-chain/'
        'beginners/08-parallel.md': 'https://core.lazybridge.com/beginners/08-parallel/'
        'beginners/09-plan.md': 'https://core.lazybridge.com/beginners/09-plan/'
