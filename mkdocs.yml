site_name: LazyBridge
site_description: Zero-boilerplate multi-provider LLM agent framework. Compose LLM pipelines that are also tools.
site_url: https://lazybridge.com/
repo_url: https://github.com/selvaz/LazyBridge
repo_name: selvaz/LazyBridge
copyright: Copyright &copy; 2026 LazyBridge — Apache-2.0

docs_dir: docs
strict: true

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/selvaz/LazyBridge
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/lazybridge/

nav:
  - Home: index.md
